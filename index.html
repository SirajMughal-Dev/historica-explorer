    <script src="https://cdn.tailwindcss.com"></script>
    <script>

        theme: {
          extend: {
            fontFamily: {
              heading: ['Outfit', 'sans-serif'],

            },
            colors: {
              /* Eco/travel green re-theme: replaces the old sky-blue accent everywhere */

                100: '#d6f9e2',
                200: '#aff0c4',
                300: '#78e1a0',

                700: '#136c41',

                50: '#ecfdf9',
                100: '#d1faf0',
                200: '#a6f2e0',
                300: '#6fe4cd',
                400: '#3ecdb5',
                500: '#21b099',

                700: '#167166',

    <link rel="preconnect" href="https://fonts.googleapis.com">
